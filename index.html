<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Four</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="panel">
      <h1>Connect Four</h1>
      <div class="status-row">
        <div id="current-player" class="status-chip"></div>
        <div id="status-text">Player 1 starts</div>
      </div>
      <div class="mode-field">
        <label for="mode-select">Game mode</label>
        <select id="mode-select">
          <option value="human">Two Players</option>
          <option value="computer">Play vs Computer</option>
        </select>
      </div>
      <div id="board" class="board" aria-label="Connect Four board"></div>
      <div class="controls">
        <button id="restart-btn">Restart Game</button>
      </div>
    </section>
    <section class="instructions">
      <h2>How to play</h2>
      <p>Click a column to drop your disc. First player to connect four discs in a row wins.</p>
      <ul>
        <li>Pink is Player 1</li>
        <li>Red is Player 2</li>
        <li>Connect four horizontally, vertically, or diagonally</li>
      </ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
